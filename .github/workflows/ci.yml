name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.os == 'windows-latest'
        run: npm ci --prefix overlay
      - if: matrix.os == 'windows-latest'
        run: npm run desktop:build
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clientluma-windows
          path: dist/clientluma-*-windows-*.zip
          if-no-files-found: error
          compression-level: 0
