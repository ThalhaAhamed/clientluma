<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ClientLuma overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; color: #0f1729; }
  .card { margin: 8px; padding: 16px 18px; background: #ffffff; border: 1px solid #e4e8ee; border-radius: 16px; box-shadow: 0 8px 28px rgba(15, 23, 41, .16); -webkit-app-region: drag; }
  b { display: block; font-size: 14px; margin-bottom: 4px; }
  span { color: #667085; }
  code { font-family: Consolas, monospace; font-size: 12px; background: #f6f8fa; padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="card">
    <b>Waiting for ClientLuma</b>
    <span>Start it with <code>npm start</code> in the project folder. This overlay reconnects every few seconds.</span>
  </div>
</body>
</html>
