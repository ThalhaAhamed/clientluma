<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client Lens</title>
<link rel="icon" href="/cuelensa-mark.svg?v=5" type="image/svg+xml" />
<link rel="stylesheet" href="/theme.css" />
<style>
/* Compact browser cue view using the same design tokens as the workspace. */
:root { --display: var(--font-display); --body: var(--font-body); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { font: 13px/1.45 var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
.stack { height: 100%; max-width: 420px; margin-inline: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
.stack::-webkit-scrollbar { width: 6px; } .stack::-webkit-scrollbar-thumb { background: rgba(15, 23, 41, .15); border-radius: 6px; }
.tile { background: var(--tile); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 5px 18px rgb(32 44 41 / .11); flex: none; }
.label { font: 600 10px/1.3 var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
h1, h2 { font-family: var(--display); margin: 0; }

.head { background: var(--charcoal); color: var(--on-charcoal); border-color: var(--charcoal); }
.head .label { color: var(--on-charcoal-muted); }
.head-row { display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; flex: none; }
.dot.live { background: var(--mint); }
.who { min-width: 0; flex: 1; }
.who h1 { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11px; }

/* say next */
.say { border-color: var(--accent-line); background: var(--shell); }
.say.high { border-color: var(--mint-line); background: var(--accent-soft); }
.say h2 { font-size: 15px; font-weight: 750; }
.say p { margin: 0; font-size: 13.5px; color: var(--ink); }
.say p:not([hidden]) { margin-top: 4px; }
.say.fresh { animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(3px); opacity: .62; } }
.say-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.say-actions a { color: var(--accent); text-decoration: none; }
.btn { border: 1px solid var(--line); background: var(--tile); border-radius: 8px; padding: 6px 9px; font: 600 12px/1.2 var(--body); cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--sunk); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head :focus-visible { outline-color: var(--mint); }
#sourceBtn { background: var(--mint); border-color: var(--mint-line); color: var(--charcoal); }
#sourceBtn:hover { background: var(--mint-hover); }
.heard { font-size: 12px; color: var(--muted); }
.heard q { color: var(--ink-2); }
.stack:has(.say:not([hidden])) .heard { display: none; }

/* signals */
.tag { display: inline-block; font: 600 10.5px/1.5 var(--body); padding: 0 7px; border-radius: 99px; white-space: nowrap; }
.t-pain_point { color: var(--pain); background: var(--pain-bg); } .t-objection { color: var(--obj); background: var(--obj-bg); }
.t-buying_signal { color: var(--buy); background: var(--buy-bg); } .t-requirement { color: var(--req); background: var(--req-bg); }
.t-question { color: var(--q); background: var(--q-bg); } .t-risk { color: var(--risk); background: var(--risk-bg); }
.signal { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stack">
  <section class="tile head">
    <div class="head-row">
      <span class="dot" id="dot"></span>
      <div class="who"><h1 id="client">Client Lens</h1><span class="label" id="status">Waiting for a Meeting bot call…</span></div>
      <a class="btn" id="finishedReport" href="/" target="_blank" rel="noopener" hidden>Report</a>
    </div>
  </section>

  <section class="tile say" id="say" aria-labelledby="sayTitle" hidden>
    <h2 id="sayTitle" aria-live="polite"></h2>
    <p id="sayText"></p>
    <div class="say-actions"><a class="btn" id="sourceBtn" href="/" target="_blank" rel="noopener" hidden>View source</a><button class="btn" id="usedBtn">Used it</button><button class="btn" id="skipBtn">Dismiss</button></div>
  </section>

  <section class="tile heard" id="heardTile" hidden><span class="label">Client just said</span><div id="heard"></div><div class="signal" id="signal" aria-label="Latest call signal" hidden></div></section>
</div>

<script src="/overlay/overlay.js"></script>
</body>
</html>
